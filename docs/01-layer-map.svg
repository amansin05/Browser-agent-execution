<svg width="760" height="640" viewBox="0 0 760 640" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
<style>
.th{font-size:13px;font-weight:600;fill:#1a1a1a}
.ts{font-size:12px;fill:#555}
.it{font-size:11px;fill:#888;font-style:italic}
.lbl{font-size:11px;fill:#888}
.arr{stroke:#888;stroke-width:1.5;fill:none}
.arrx{stroke:#c98b7a;stroke-width:1.5;fill:none}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#c98b7a" stroke-width="1.5"/></marker>
</defs>
<text x="30" y="24" text-anchor="start" font-size="15" font-weight="700" fill="#1a1a1a">Browser Agent — the 5-layer stack</text>
<rect x="60" y="44" width="640" height="60" rx="8" fill="#e8f0fe" stroke="#9bb8e8"/>
<text class="th" x="72" y="74.0" text-anchor="start">L1 · Chat UI</text>
<text class="ts" x="72" y="91.19999999999999" text-anchor="start">React + TypeScript console (dev-ui) — drives the agent, streams every step live</text>
<text class="lbl" x="688" y="78.0" text-anchor="end">you type a task</text>
<line x1="380" y1="104" x2="380" y2="122" class="arr" marker-end="url(#a)"/>
<rect x="60" y="122" width="640" height="60" rx="8" fill="#e6f4f1" stroke="#8fc7bb"/>
<text class="th" x="72" y="152.0" text-anchor="start">L2 · Transport</text>
<text class="ts" x="72" y="169.2" text-anchor="start">FastAPI WebSocket backend (server/app.py) — one connection = one session</text>
<text class="lbl" x="688" y="156.0" text-anchor="end">events / approvals</text>
<line x1="380" y1="182" x2="380" y2="200" class="arr" marker-end="url(#a)"/>
<rect x="60" y="200" width="640" height="60" rx="8" fill="#f0e9f7" stroke="#c3a8df"/>
<text class="th" x="72" y="230.0" text-anchor="start">L3 · Orchestration</text>
<text class="ts" x="72" y="247.2" text-anchor="start">AgentSession + orchestrate.py — plan → reason → verify → re-plan</text>
<text class="lbl" x="688" y="234.0" text-anchor="end">runs the flow</text>
<line x1="380" y1="260" x2="380" y2="278" class="arr" marker-end="url(#a)"/>
<rect x="60" y="278" width="640" height="96" rx="8" fill="#fdecea" stroke="#eaa79c"/>
<text class="th" x="72" y="298" text-anchor="start">L4 · The Brain (Groq models, by role)</text>
<text class="ts" x="72" y="316" text-anchor="start">planner qwen3-32b · reasoner llama-4-scout · verifier · composer gpt-oss-120b</text>
<text class="ts" x="72" y="332" text-anchor="start">+ web-grounding · deterministic scorer · content extractor · reflection</text>
<text class="lbl" x="688" y="330.0" text-anchor="end">thinks</text>
<line x1="380" y1="374" x2="380" y2="392" class="arr" marker-end="url(#a)"/>
<rect x="60" y="392" width="640" height="188" rx="10" fill="none" stroke="#ccc" stroke-dasharray="4 4"/>
<text class="it" x="74" y="412">L5 · The hands + the browser + memory</text>
<text class="lbl" x="688" y="412" text-anchor="end">acts + remembers</text>
<rect x="86" y="432" width="196" height="70" rx="8" fill="#e6f4f1" stroke="#8fc7bb"/>
<text class="th" x="184.0" y="452" text-anchor="middle">Playwright MCP</text>
<text class="ts" x="184.0" y="470" text-anchor="middle">the hands:</text>
<text class="ts" x="184.0" y="486" text-anchor="middle">click · type · scroll · see</text>
<rect x="300" y="432" width="196" height="70" rx="8" fill="#e8f0fe" stroke="#9bb8e8"/>
<text class="th" x="398.0" y="452" text-anchor="middle">Your live Chrome</text>
<text class="ts" x="398.0" y="470" text-anchor="middle">real, logged-in tab</text>
<text class="ts" x="398.0" y="486" text-anchor="middle">via the Bridge extension</text>
<rect x="514" y="432" width="162" height="70" rx="8" fill="#e7f3ea" stroke="#9ccaa6"/>
<text class="th" x="595.0" y="452" text-anchor="middle">SQLite memory</text>
<text class="ts" x="595.0" y="470" text-anchor="middle">sessions + profile</text>
<text class="ts" x="595.0" y="486" text-anchor="middle">.browser_agent_memory</text>
<rect x="190" y="516" width="380" height="48" rx="8" fill="#f4f3f0" stroke="#cfccc4"/>
<text class="th" x="380.0" y="541.2" text-anchor="middle">npx @playwright/mcp  (Node.js subprocess)</text>
<text class="ts" x="380.0" y="554.56" text-anchor="middle">the bridge between Python brain and real Chrome</text>
</svg>
