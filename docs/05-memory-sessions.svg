<svg width="760" height="640" viewBox="0 0 760 640" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
<style>
.th{font-size:13px;font-weight:600;fill:#1a1a1a}
.ts{font-size:12px;fill:#555}
.it{font-size:11px;fill:#888;font-style:italic}
.lbl{font-size:11px;fill:#888}
.arr{stroke:#888;stroke-width:1.5;fill:none}
.arrx{stroke:#c98b7a;stroke-width:1.5;fill:none}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#c98b7a" stroke-width="1.5"/></marker>
</defs>
<text x="30" y="24" text-anchor="start" font-size="15" font-weight="700" fill="#1a1a1a">Memory, state &amp; tab parking</text>
<rect x="14" y="40" width="732" height="170" rx="10" fill="none" stroke="#ccc" stroke-dasharray="4 4"/>
<text class="it" x="28" y="60">WITHIN A SESSION — one browser, many tasks</text>
<rect x="40" y="72" width="210" height="64" rx="8" fill="#e7f3ea" stroke="#9ccaa6"/>
<text class="th" x="145.0" y="92" text-anchor="middle">Session state</text>
<text class="ts" x="145.0" y="110" text-anchor="middle">candidates · selected</text>
<text class="ts" x="145.0" y="126" text-anchor="middle">answers · failed sources</text>
<rect x="275" y="72" width="200" height="64" rx="8" fill="#e7f3ea" stroke="#9ccaa6"/>
<text class="th" x="375.0" y="92" text-anchor="middle">Scratchpad</text>
<text class="ts" x="375.0" y="110" text-anchor="middle">notes gathered this run</text>
<text class="ts" x="375.0" y="126" text-anchor="middle">carried to later tasks</text>
<rect x="500" y="72" width="226" height="64" rx="8" fill="#fdf3e3" stroke="#e8c98f"/>
<text class="th" x="613.0" y="92" text-anchor="middle">Rolling context</text>
<text class="ts" x="613.0" y="110" text-anchor="middle">last few task/result turns</text>
<text class="ts" x="613.0" y="126" text-anchor="middle">→ lets planner resolve 'it' / 'that'</text>
<text class="it" x="40" y="188" text-anchor="start">All of the above feed the planner as a memory preamble each task.</text>
<rect x="14" y="224" width="732" height="150" rx="10" fill="none" stroke="#ccc" stroke-dasharray="4 4"/>
<text class="it" x="28" y="244">PERSISTENT — local SQLite (.browser_agent_memory)</text>
<rect x="60" y="256" width="300" height="84" rx="8" fill="#f0e9f7" stroke="#c3a8df"/>
<text class="th" x="210.0" y="276" text-anchor="middle">Profile (learns over time)</text>
<text class="ts" x="210.0" y="294" text-anchor="middle">persona — stable facts</text>
<text class="ts" x="210.0" y="310" text-anchor="middle">preferences — slow EMA drift · episodes</text>
<rect x="400" y="256" width="286" height="84" rx="8" fill="#f4f3f0" stroke="#cfccc4"/>
<text class="th" x="543.0" y="276" text-anchor="middle">Per-run trace</text>
<text class="ts" x="543.0" y="294" text-anchor="middle">replayable JSONL log of every</text>
<text class="ts" x="543.0" y="310" text-anchor="middle">plan/step/verifier event</text>
<rect x="14" y="388" width="732" height="234" rx="10" fill="none" stroke="#ccc" stroke-dasharray="4 4"/>
<text class="it" x="28" y="408">TAB PARKING — tidy up, but be ready to resume</text>
<rect x="270" y="418" width="220" height="56" rx="8" fill="#e8f0fe" stroke="#9bb8e8"/>
<text class="th" x="380.0" y="438" text-anchor="middle">Task finishes</text>
<text class="ts" x="380.0" y="456" text-anchor="middle">close the working tabs,</text>
<text class="ts" x="380.0" y="472" text-anchor="middle">but first SAVE their URLs</text>
<line x1="380" y1="474" x2="380" y2="500" class="arr" marker-end="url(#a)"/>
<rect x="280" y="502" width="200" height="50" rx="8" fill="#fdf3e3" stroke="#e8c98f"/>
<text class="th" x="380.0" y="528.0" text-anchor="middle">Next task a follow-up?</text>
<text class="ts" x="380.0" y="542.0" text-anchor="middle">a cheap LLM check decides</text>
<line x1="330" y1="552" x2="200" y2="588" class="arr" marker-end="url(#a)"/>
<line x1="430" y1="552" x2="560" y2="588" class="arr" marker-end="url(#a)"/>
<rect x="70" y="590" width="260" height="26" rx="8" fill="#e7f3ea" stroke="#9ccaa6"/>
<text class="th" x="200.0" y="607.0" text-anchor="middle">yes → reopen those exact tabs</text>
<rect x="430" y="590" width="260" height="26" rx="8" fill="#f4f3f0" stroke="#cfccc4"/>
<text class="th" x="560.0" y="607.0" text-anchor="middle">no → start clean</text>
<text class="it" x="508" y="470" text-anchor="start">your own tab is never parked or closed</text>
</svg>
